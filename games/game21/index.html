<!-- Fåglarna flyger hem (Game 21) – help each coloured bird fly home to the nest of the same colour -->
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Set viewport height for PWA standalone mode - must run early -->
    <script>
        (function() {
            function setViewportHeight() {
                const vh = window.innerHeight;
                document.documentElement.style.setProperty('--actual-vh', vh + 'px');
            }
            setViewportHeight();
            window.addEventListener('resize', setViewportHeight);
            window.addEventListener('orientationchange', setViewportHeight);
        })();
    </script>
    <title>Fåglarna flyger hem</title>
    <link rel="stylesheet" href="../../css/tailwind.output.css">
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="game.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-200 via-lime-50 to-green-100">
    <div class="game21-wrapper">
        <header class="game21-header">
            <div class="game21-header__buttons">
                <a href="../../index.html" class="back-button" aria-label="Tillbaka till alla spel">⟵</a>
                <div id="round-progress" class="game21-pips" role="group" aria-live="polite"></div>
            </div>
            <!-- Empty slot matches game 19/20 header (spoken prompts only) -->
            <div class="game21-header__center">
                <h1 class="game21-title" aria-hidden="true"></h1>
                <p class="game21-instructions" id="instructions-text" aria-live="polite"></p>
            </div>
        </header>

        <main id="game21-field" class="game21-field" aria-live="polite">
            <div id="game21-stage" class="game21-stage">
                <button id="listen-button" class="game21-listen" type="button" aria-label="Spela om frågan">
                    <svg class="game21-listen__icon" viewBox="0 0 24 24" width="100%" height="100%" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>

                <!-- Nests in the tree (built per round by game.js) -->
                <div id="nest-layer" class="game21-nest-layer" role="group"></div>

                <!-- Little music notes / hearts from happy chicks (CSS only) -->
                <div id="note-layer" class="game21-note-layer" aria-hidden="true"></div>

                <!-- The bird that wants to go home: two stacked frames (wings up / down) -->
                <button id="bird" class="game21-bird" type="button" hidden>
                    <span class="game21-bird__bob">
                        <span class="game21-bird__body">
                            <img id="bird-up" class="game21-bird__img game21-bird__img--up" alt="" draggable="false">
                            <img id="bird-down" class="game21-bird__img game21-bird__img--down" alt="" draggable="false">
                        </span>
                    </span>
                </button>

                <canvas id="game21-confetti-canvas" class="game21-confetti" aria-hidden="true"></canvas>
            </div>
        </main>
    </div>

    <div id="completion-dialog" class="completion-dialog" hidden>
        <div class="completion-dialog__content" role="dialog" aria-modal="true" aria-labelledby="completion-title">
            <h2 id="completion-title" class="completion-dialog__title"></h2>
            <p id="completion-message" class="completion-dialog__message"></p>
            <div class="completion-dialog__actions">
                <button id="continue-button" class="completion-dialog__btn completion-dialog__btn--primary" type="button"></button>
                <button id="dialog-back-button" class="completion-dialog__btn completion-dialog__btn--secondary" type="button"></button>
            </div>
        </div>
    </div>

    <script src="../../js/config.js" defer></script>
    <script src="../../js/version-check.js" defer></script>
    <script src="../../js/assets.js" defer></script>
    <script src="../../js/volume-control.js" defer></script>
    <script src="../../js/audio.js" defer></script>
    <script src="../../js/fx.js" defer></script>
    <script src="strings.js" defer></script>
    <script src="game.js" defer></script>
</body>
</html>
